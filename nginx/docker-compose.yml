services: 
  nginx-main:
    image: nginx:stable-alpine
    container_name: store_nginx
    ports:
      - "80:80" 
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
    - shop-network
    restart: always

networks:
  default:
    external: true
    name: shop-network