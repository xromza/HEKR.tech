name: CI/CD Pipeline

on:
  push:
    branches: [ prod, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        run: mvn test -f backend/pom.xml 

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          if [[ ${{ github.ref_name }} == 'prod' ]]; then TAG=latest; else TAG=dev; fi
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hekr-store-backend:$TAG ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/hekr-store-backend:$TAG
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hekr-store-nextjs:$TAG ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/hekr-store-nextjs:$TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            
            if [[ "${{ github.ref_name }}" == "prod" ]]; then
              DEPLOY_PATH="$HOME/shop-prod/store_project"
            else
              DEPLOY_PATH="$HOME/shop-dev/store_project"
            fi
            
            cd $DEPLOY_PATH
            
            git pull origin ${{ github.ref_name }}
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Чистим мусор
            docker image prune -f