name: CI/CD Pipeline

on:
  push:
    branches: [ prod, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        run: mvn test -f backend/pom.xml 

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Environment Variables
        run: |
          if [[ ${{ github.ref_name }} == 'prod' ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
          fi

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shop-backend:${{ env.TAG }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shop-nextjs:${{ env.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            
            if [[ "${{ github.ref_name }}" == "prod" ]]; then
              DEPLOY_PATH="~/shop-prod/store_project"
            else
              DEPLOY_PATH="~/shop-dev/store_project"
            fi
            
            echo "Moving to $DEPLOY_PATH"
            cd $DEPLOY_PATH
            
            git pull origin ${{ github.ref_name }}
            
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            
            export DOCKER_USERNAME="$DOCKER_USERNAME"
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            docker image prune -af