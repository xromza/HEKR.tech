name: CI/CD Pipeline

on:
  push:
    branches: [ prod, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        run: mvn test -f backend/pom.xml 

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hekr-store-backend:${{ github.ref_name == 'prod' && 'latest' || 'dev' }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hekr-store-nextjs:${{ github.ref_name == 'prod' && 'latest' || 'dev' }}
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH=$([[ "${{ github.ref_name }}" == "prod" ]] && echo "$HOME/shop-prod" || echo "$HOME/shop-dev")
            
            cd $DEPLOY_PATH
            git pull origin ${{ github.ref_name }}
            
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker exec store_nginx nginx -s reload